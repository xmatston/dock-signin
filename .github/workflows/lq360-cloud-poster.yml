name: LQ360 Cloud Investigation Poster

# Runs every 5 minutes in GitHub's cloud — no laptop required.
# Reads #geu3-lq360-alerts, detects NEW "Load Quality Defect Created" alerts,
# compiles an investigation skeleton + accept/dispute bridge checklist, and posts
# it to the channel AS THE "GEU3 LQ360 Investigation" app via chat.postMessage.
#
# SECURITY: the Slack bot token is read from an encrypted GitHub Actions Secret
# (secrets.SLACK_BOT_TOKEN). It is NEVER written into source.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: lq360-poster
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Poll LQ360 and post investigations
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: C08AG90NBDW
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "::error::SLACK_BOT_TOKEN secret is not set."
            exit 1
          fi
          STATE_FILE="lq360_state.json"
          if [ ! -f "$STATE_FILE" ]; then echo '{"processed_ts":[],"last_poll":""}' > "$STATE_FILE"; fi
          HIST=$(curl -s -G "https://slack.com/api/conversations.history" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --data-urlencode "channel=$CHANNEL_ID" \
            --data-urlencode "limit=50")
          OK=$(echo "$HIST" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            ERR=$(echo "$HIST" | jq -r '.error')
            echo "::error::conversations.history failed: $ERR"
            if [ "$ERR" = "not_in_channel" ]; then
              echo "Fix: in Slack run /invite @GEU3 LQ360 Investigation in #geu3-lq360-alerts"
            elif [ "$ERR" = "missing_scope" ]; then
              echo "Fix: add channels:history + channels:read scopes and reinstall. Needed=$(echo "$HIST" | jq -r '.needed')"
            fi
            exit 1
          fi
          echo "Read OK. Scanning for new defect-created alerts..."
          echo "$HIST" | jq -c '.messages | reverse | .[]' | while read -r msg; do
            TS=$(echo "$msg" | jq -r '.ts')
            TEXT=$(echo "$msg" | jq -r '.text // ""')
            echo "$TEXT" | grep -qi "Load Quality Defect Created" || continue
            echo "$TEXT" | grep -qi "Assigned" || continue
            if jq -e --arg ts "$TS" '.processed_ts | index($ts)' "$STATE_FILE" >/dev/null; then continue; fi
            VRID=$(echo "$TEXT" | grep -oiE "VRID[^A-Z0-9]*[A-Z0-9]{8,}" | head -1 | grep -oiE "[A-Z0-9]{8,}$" || true)
            DD=$(echo "$TEXT" | grep -oiE "DD[[:space:]]*[0-9]+" | head -1 | grep -oE "[0-9]+" | head -1 || true)
            TYPE=$(echo "$TEXT" | sed -nE 's/.*Type:[[:space:]]*([A-Za-z ]+).*/\1/Ip' | head -1 || true)
            LPN=$(echo "$TEXT" | sed -nE 's/.*LPN:[[:space:]]*([A-Z0-9]+).*/\1/Ip' | head -1 || true)
            SEQ=$(echo "$TEXT" | sed -nE 's/.*Sequence:[[:space:]]*([A-Za-z0-9>_-]+).*/\1/Ip' | head -1 || true)
            DOOR="$DD"; SRC="from LQ360 DD conversion - unverified"
            if [ -n "$DD" ]; then
              LEN=${#DD}
              if   [ "$LEN" -eq 3 ] && [ "${DD:0:1}" = "3" ]; then DOOR="$DD"
              elif [ "$LEN" -le 2 ]; then DOOR="3$DD"
              elif [ "$LEN" -eq 3 ]; then DOOR="3${DD:1:2}"; fi
            fi
            [ -z "$DOOR" ] && DOOR="UNKNOWN"
            [ -z "$VRID" ] && VRID="UNKNOWN"
            INV="LQ360 Investigation - Door ${DOOR} - ${VRID}"
            INV="${INV}\nDefect: ${TYPE}"
            INV="${INV}\nSequence: ${SEQ}"
            INV="${INV}\nLPN: ${LPN}"
            INV="${INV}\n\nTIMELINE"
            INV="${INV}\nStart: N/A - Check YMS https://trans-logistics.amazon.com/yms/eventHistory (search LPN: ${LPN})"
            INV="${INV}\nComplete: N/A - Check YMS"
            INV="${INV}\nDownstream Arrival: N/A - Check YMS"
            INV="${INV}\n\nDOOR RESOLUTION"
            INV="${INV}\nDoor: ${DOOR} (${SRC})"
            INV="${INV}\n\nAUDIT STATUS"
            INV="${INV}\nPoke Test: N/A - Check Apollo https://apollo-audit.corp.amazon.com/reporting/results_by_audit?audit_type_id=27156"
            INV="${INV}\nOB Inspect Audit: N/A - Check Apollo https://apollo-audit.corp.amazon.com/reporting/results_by_audit?audit_type_id=29405"
            INV="${INV}\nTDR Release PIC: N/A - Check YMS for releasing user"
            INV="${INV}\nGTDR Vehicle History: https://www.amazonlogistics.com/gtdr/dashboard/vehicle_history?vrid=${VRID}"
            INV="${INV}\n\nWALL BUILDER ACCOUNTABILITY"
            INV="${INV}\nWB AAs: Check Wall_Builder_Tracker.xlsx (WB Sign-In Log) for door ${DOOR}"
            INV="${INV}\nWall Audit Feedback: Check #geu3-fill-rate-utilization"
            INV="${INV}\nFill Rate Audit: Check #geu3-fill-rate-utilization"
            INV="${INV}\n\nMANAGER ACTION REQUIRED - Bridge this defect (Accept or Dispute) with rationale:"
            INV="${INV}\n- Start/Complete/Arrival times (from YMS)"
            INV="${INV}\n- Poke Test and OB Inspect counts (from Apollo)"
            INV="${INV}\n- WB AA accountability (from tracker)"
            INV="${INV}\n- Fill Rate audit results"
            INV="${INV}\n- Decision rationale and corrective actions"
            MSG=$(printf "%b" "$INV")
            RESP=$(curl -s -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg ch "$CHANNEL_ID" --arg txt "$MSG" --arg ts "$TS" '{channel:$ch, text:$txt, thread_ts:$ts, unfurl_links:false}')")
            if [ "$(echo "$RESP" | jq -r '.ok')" = "true" ]; then
              echo "Posted investigation for ts=$TS (door $DOOR, vrid $VRID)"
              jq --arg ts "$TS" '.processed_ts += [$ts]' "$STATE_FILE" > "$STATE_FILE.tmp" && mv "$STATE_FILE.tmp" "$STATE_FILE"
            else
              echo "::warning::post failed for ts=$TS: $(echo "$RESP" | jq -r '.error')"
            fi
          done
          jq '.last_poll=(now|todate) | .processed_ts=(.processed_ts[-200:])' "$STATE_FILE" > "$STATE_FILE.tmp" && mv "$STATE_FILE.tmp" "$STATE_FILE"

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lq360_state.json
          git commit -m "chore: update LQ360 poll state [skip ci]" || echo "no changes"
          git push || echo "push skipped"
