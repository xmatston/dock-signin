<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GEU3 Dock Door Sign In/Out</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
  .container { width: 100%; max-width: 500px; padding: 20px; }
  .card { background: #16213e; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); overflow: hidden; }
  .status-bar { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; background: #0f3460; font-size: 13px; }
  .status-bar .shift { font-weight: 700; font-size: 16px; color: #00ff88; }
  .status-bar .clock { color: #aaa; }
  .main-display { padding: 40px 24px; text-align: center; min-height: 250px; }
  .door-info { margin-bottom: 20px; }
  .door-num { font-size: 60px; font-weight: 800; color: white; }
  .door-action { display: inline-block; padding: 6px 24px; border-radius: 20px; font-size: 16px; font-weight: 700; margin-top: 8px; }
  .door-action.signin { background: #27ae60; }
  .door-action.signout { background: #e74c3c; }
  .role-label { font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
  .badge-prompt { font-size: 20px; color: #4472C4; margin-top: 24px; animation: pulse 2s infinite; }
  .success-check { font-size: 60px; margin-bottom: 12px; }
  .success-name { font-size: 24px; font-weight: 700; }
  .success-detail { font-size: 14px; color: #aaa; margin-top: 8px; }
  .error-text { color: #e74c3c; font-size: 18px; }
  .hidden-input { position: absolute; left: -9999px; opacity: 0; }
  .scan-log { padding: 16px 20px; background: #0f3460; max-height: 200px; overflow-y: auto; }
  .scan-log h3 { font-size: 12px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .log-entry { font-size: 13px; padding: 4px 0; border-bottom: 1px solid #1a1a3e; color: #aaa; }
  .log-entry .log-time { color: #666; }
  .log-entry .log-name { color: #00ff88; font-weight: 600; }
  .log-entry .log-door { color: #4472C4; }
  .log-entry .log-action { font-weight: 600; }
  .log-entry .log-action.si { color: #27ae60; }
  .log-entry .log-action.so { color: #e74c3c; }
  .connection-status { text-align: center; padding: 6px; font-size: 11px; color: #27ae60; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .animate { animation: fadeIn 0.3s ease; }
</style>
</head>

  // Read door info from URL params (set by QR code)
  var params = new URLSearchParams(window.location.search);
  var doorFromURL = params.get('door') || '';
  var actionFromURL = params.get('action') || 'SI';
  var roleFromURL = params.get('role') || 'WB';
  
  var currentDoor = doorFromURL;
  var currentAction = actionFromURL === 'SO' ? 'signout' : 'signin';
  var currentRole = roleFromURL === 'PIT' ? 'pitdriver' : 'wallbuilder';

  function detectShift() {
    var now = new Date(), h = now.getHours(), m = now.getMinutes(), t = h + m/60, d = now.getDay();
    var isDay, ed;
    if (t >= 7.5 && t < 18) { isDay = true; ed = d; }
    else if (t >= 18.5 || t < 5) { isDay = false; ed = (t >= 18.5) ? d : (d+6)%7; }
    else if (t >= 5 && t < 7.5) { isDay = false; ed = (d+6)%7; }
    else { isDay = true; ed = d; }
    if (isDay) { return ed===0||ed===1||ed===2?'FHD':ed===3?'DS':'BHD'; }
    else { return ed===0||ed===1||ed===2?'FHN':ed===3?'NS':'BHN'; }
  }

  function updateClock() {
    var now = new Date();
    document.getElementById('clockDisplay').textContent = now.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('shiftDisplay').textContent = detectShift();
  }
  updateClock(); setInterval(updateClock, 1000);

  function setDisplay(html) {
    var d = document.getElementById('mainDisplay');
    d.innerHTML = html;
    d.className = 'main-display animate';
  }

  function addLog(time, login, door, action) {
    var logDiv = document.getElementById('logEntries');
    if (logDiv.querySelector('[style]')) logDiv.innerHTML = '';
    var cls = action === 'signin' ? 'si' : 'so';
    var label = action === 'signin' ? 'IN' : 'OUT';
    var arrow = action === 'signin' ? '&#x2192;' : '&#x2190;';
    var entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = '<span class="log-time">' + time + '</span> <span class="log-name">' + login + '</span> <span class="log-action ' + cls + '">' + label + '</span> <span class="log-door">' + arrow + ' Door ' + door + '</span>';
    logDiv.insertBefore(entry, logDiv.firstChild);
    if (logDiv.children.length > 20) logDiv.removeChild(logDiv.lastChild);
  }

  // Show door info immediately (from URL params)
  function showBadgePrompt() {
    var actionLabel = currentAction === 'signin' ? 'SIGN IN' : 'SIGN OUT';
    var actionClass = currentAction === 'signin' ? 'signin' : 'signout';
    var roleLabel = currentRole === 'pitdriver' ? 'PIT DRIVER' : 'WALL BUILDER';
    setDisplay(
      '<div class="role-label">' + roleLabel + '</div>' +
      '<div class="door-info"><div class="door-num">' + currentDoor + '</div>' +
      '<div class="door-action ' + actionClass + '">' + actionLabel + '</div></div>' +
      '<div class="badge-prompt">Scan associate badge</div>'
    );
  }

  function showSuccess(name, login, door, action, shift, time) {
    var actionText = action === 'signin' ? 'Signed In' : 'Signed Out';
    setDisplay(
      '<div class="success-check">&#x2705;</div>' +
      '<div class="success-name">' + name + '</div>' +
      '<div class="success-detail">' + actionText + ' @ Door ' + door + ' | ' + shift + ' | ' + time + '</div>'
    );
  }

  function showError(msg) {
    setDisplay('<div class="error-text">' + msg + '</div>');
    setTimeout(showBadgePrompt, 3000);
  }

  // If door is in URL, show badge prompt immediately
  if (currentDoor) {
    try { document.getElementById('sndBadge').currentTime=0; document.getElementById('sndBadge').play(); } catch(e) {}
    showBadgePrompt();
  } else {
    setDisplay('<div class="badge-prompt" style="color:#e74c3c;">No door specified in URL.<br>Scan a QR code to begin.</div>');
  }

  // Handle badge scan
  function handleBadgeScan(text) {
    text = text.trim();
    if (!text) return;
    
    // Check if scanner typed a URL (from URL-encoded QR code)
    if (text.indexOf('door=') >= 0) {
      try {
        var urlParams;
        if (text.indexOf('?') >= 0) {
          urlParams = new URLSearchParams(text.substring(text.indexOf('?')));
        } else {
          urlParams = new URLSearchParams(text);
        }
        var d = urlParams.get('door');
        var a = urlParams.get('action');
        var r = urlParams.get('role');
        if (d) {
          currentDoor = d;
          currentAction = (a === 'SO') ? 'signout' : 'signin';
          currentRole = (r === 'PIT') ? 'pitdriver' : 'wallbuilder';
          try { document.getElementById('sndBadge').currentTime=0; document.getElementById('sndBadge').play(); } catch(e) {}
          showBadgePrompt();
          return;
        }
      } catch(e) {}
    }
    
    // Check if scanner typed a door code (e.g. 302-SI-WB)
    var doorMatch = text.match(/^(\d{3})-(SI|SO)-(WB|PIT)$/);
    if (doorMatch) {
      currentDoor = doorMatch[1];
      currentAction = doorMatch[2] === 'SO' ? 'signout' : 'signin';
      currentRole = doorMatch[3] === 'PIT' ? 'pitdriver' : 'wallbuilder';
      try { document.getElementById('sndBadge').currentTime=0; document.getElementById('sndBadge').play(); } catch(e) {}
      showBadgePrompt();
      return;
    }
    
    if (!currentDoor) {
      // No door set yet — show error
      setDisplay('<div class="error-text">Scan a dock door QR code first</div>');
      setTimeout(function() { setDisplay('<div class="badge-prompt" style="color:#e74c3c;">No door specified.<br>Scan a QR code to begin.</div>'); }, 3000);
      return;
    }
    
    var emp = BADGE_LOOKUP[text];
    if (emp) {
      var now = new Date();
      var timeStr = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
      var dateStr = now.toLocaleDateString('en-US');
      var shift = detectShift();

      try { document.getElementById('sndSuccess').currentTime=0; document.getElementById('sndSuccess').play(); } catch(e) {}
      showSuccess(emp.name, emp.login, currentDoor, currentAction, shift, timeStr);
      addLog(timeStr, emp.login, currentDoor, currentAction);

      // Send data via sendBeacon (no CORS on GitHub Pages!)
      var entry = { date: dateStr, shift: shift, login: emp.login, name: emp.name, door: 'Door ' + currentDoor, vrid: '', time: timeStr, action: currentAction, role: currentRole };
      
      // Post to Microsoft Forms response Excel via Graph API would need auth
      // Instead, save to the DockSignIns SharePoint List endpoint
      // For now, log locally and the agent will pick it up
      
      // Send to GitHub Issues via sendBeacon
      var issueTitle = 'SCAN|' + currentDoor + '|' + (currentAction==='signin'?'SI':'SO') + '|' + (currentRole==='wallbuilder'?'WB':'PIT') + '|' + emp.login + '|' + emp.name + '|' + shift + '|' + timeStr + '|' + dateStr;
      var issueBody = JSON.stringify(entry, null, 2);
      var ghPayload = JSON.stringify({ title: issueTitle, body: issueBody });
      
      fetch('https://api.github.com/repos/xmatston/dock-signin/issues', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer 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',
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github+json'
        },
        body: ghPayload
      }).then(function(r) {
        if (r.ok) {
          document.getElementById('connStatus').innerHTML = '&#x2713; ' + emp.login + ' recorded @ Door ' + currentDoor;
        } else {
          document.getElementById('connStatus').innerHTML = '&#x2717; Upload failed (' + r.status + ')';
        }
      }).catch(function(e) {
        document.getElementById('connStatus').innerHTML = '&#x2717; Offline — ' + e.message;
      });

      // Reset to badge prompt after 3 seconds
      setTimeout(showBadgePrompt, 3000);
    } else if (text.match(/^\d{5,8}$/)) {
      try { document.getElementById('sndError').currentTime=0; document.getElementById('sndError').play(); } catch(e) {}
      showError('Badge not found in roster');
    }
  }

  // Hidden input captures all scanner input
  var scanInput = document.getElementById('scanInput');
  document.addEventListener('click', function() { scanInput.focus(); });
  setInterval(function() { if (document.activeElement !== scanInput) scanInput.focus(); }, 500);

  var scanTimer = null;
  scanInput.addEventListener('input', function() {
    clearTimeout(scanTimer);
    scanTimer = setTimeout(function() {
      var text = scanInput.value.trim();
      scanInput.value = '';
      if (text) handleBadgeScan(text);
    }, 300);
  });
  scanInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      clearTimeout(scanTimer);
      var text = scanInput.value.trim();
      scanInput.value = '';
      if (text) handleBadgeScan(text);
    }
  });
  scanInput.focus();
